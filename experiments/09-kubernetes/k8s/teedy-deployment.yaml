# 实验九：Teedy Kubernetes 部署清单
# Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teedy
  labels:
    app: teedy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teedy
  template:
    metadata:
      labels:
        app: teedy
    spec:
      containers:
        - name: teedy
          image: teedy:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DOCS_BASE_URL
              value: "http://localhost:8888"
            - name: DOCS_ADMIN_EMAIL_INIT
              value: "admin@example.com"
            - name: DOCS_ADMIN_PASSWORD_INIT
              value: "$2a$05$PcMNUbJvsk7QHFSfEIDaIOjk1VI9/E7IPjTKx.jkjPxkx2EOKSoPS"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: teedy
  labels:
    app: teedy
spec:
  type: NodePort
  selector:
    app: teedy
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
