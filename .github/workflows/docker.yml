# Teedy Docker 容器化流水线（实验八）
# 用 GitHub Actions 的 ubuntu runner（自带 Docker）完成：
#   1. 构建 Teedy Docker 镜像
#   2. docker run 启动容器（宿主机端口 8888 → 容器 8080）
#   3. 验证浏览器访问（HTTP 探测 8888 端口）
#   4. 推送镜像至 GHCR（GitHub Container Registry）
#
# 说明：本机未安装 Docker，故用 CI 的 Docker 环境完成镜像构建/运行/推送的
# 真实验证。镜像推送到 GHCR（无需 Docker Hub 账号密码，用内置 GITHUB_TOKEN）。

name: Docker

on:
  push:
    branches: [ master ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docs.xml'
      - 'docs-core/**'
      - 'docs-web/**'
      - 'docs-web-common/**'
      - 'pom.xml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR 要求镜像名小写（github.repository 可能是大写 Teedy，需规范化为小写）
  IMAGE_NAME: ${{ github.repository_owner }}/teedy

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 构建、运行并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（tags/labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # ===== 步骤 1：构建镜像 =====
      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== 步骤 2：docker run 启动容器（宿主机 8888 → 容器 8080）=====
      - name: 启动容器（端口 8888）
        run: |
          # 用构建阶段 load 进来的镜像（latest tag），与 env.IMAGE_NAME 一致
          docker run -d --name teedy \
            -p 8888:8080 \
            -e DOCS_BASE_URL="http://localhost:8888" \
            -e DOCS_ADMIN_EMAIL_INIT="admin@example.com" \
            -e "DOCS_ADMIN_PASSWORD_INIT=\$2a\$05\$PcMNUbJvsk7QHFSfEIDaIOjk1VI9/E7IPjTKx.jkjPxkx2EOKSoPS" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # ===== 步骤 3：验证浏览器访问（HTTP 探测 8888）=====
      - name: 验证容器可访问（端口 8888）
        run: |
          echo "等待容器启动..."
          # 等待最多 120 秒，直到 8888 端口可访问
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8888/ 2>/dev/null | grep -q "200\|301\|302"; then
              echo "容器已启动，端口 8888 可访问"
              break
            fi
            echo "等待中... ($i/60)"
            sleep 2
          done
          echo "=== 访问首页，验证 HTTP 状态码 ==="
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8888/ || true)
          echo "首页 HTTP 状态码: $HTTP_CODE"
          echo "=== 容器日志（前 30 行）==="
          docker logs teedy 2>&1 | head -30
          echo "=== 容器状态 ==="
          docker ps -a --filter name=teedy --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          # 验证容器确实在监听 8888 → 8080 映射
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "301" ] && [ "$HTTP_CODE" != "302" ] && [ "$HTTP_CODE" != "404" ]; then
            echo "::error::容器未能通过 8888 端口正常响应，HTTP 状态码: $HTTP_CODE"
            exit 1
          fi
          echo "✅ 验证通过：容器通过宿主机 8888 端口正常响应"

      # ===== 步骤 4：推送镜像至 GHCR =====
      - name: 推送镜像至 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
