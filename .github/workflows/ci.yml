# Teedy 持续集成流水线（实验七）
# 包含：Maven 构建、PMD 代码检查、自动化测试、Surefire 测试报告、
#       JavaDoc 文档生成、可执行 JAR / WAR 制品归档。
#
# 说明：本项目存在 3 个上游基线测试失败（TestMimeTypeUtil、
#       TestPdfFormatHandler#testIssue373、TestFileUtil，源于 JDK11 MIME
#       映射与 PDFBox 版本差异），为如实反映流水线拦截能力，测试阶段
#       不做任何降级，失败即红灯，并在报告中如实记录。

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Maven 构建与质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ===== 阶段 1：Maven 构建（编译 + 打包，跳过测试以先保证可构建）=====
      - name: Maven 构建（compile）
        run: mvn -B -ntp clean compile

      # ===== 阶段 2：PMD 代码检查（生成 pmd.xml / pmd.html / cpd.xml 报告）=====
      # 定位为「观察报告」而非「阻断门禁」：上游存量代码有数百处违规与重复块，
      # 生成报告并归档即可，不作为构建门禁（详见 experiments/07-ci-cd/notes.md）。
      - name: PMD 代码检查（生成报告）
        run: mvn -B -ntp pmd:pmd pmd:cpd
        continue-on-error: true

      # ===== 阶段 3：自动化测试 + Surefire 报告 + JaCoCo 覆盖率 =====
      # 项目存在 3 个上游基线测试失败（MimeTypeUtil/PDFBox 版本差异），
      # 测试如实运行，失败不降级；但用 continue-on-error 让后续阶段仍能
      # 产出 JavaDoc / 制品 / 报告，最后在「检查测试结果」步骤如实标红。
      - name: 运行自动化测试
        id: test
        run: mvn -B -ntp test
        continue-on-error: true

      # ===== 阶段 4：完整打包（生成 WAR / JAR 制品 + JavaDoc）=====
      # JavaDoc 已在 pom.xml 中绑定到 package 阶段（attach-javadocs execution）。
      # 用 install（而非 package）：docs-web 的 javadoc/package 需要解析
      # docs-core/docs-web-common 依赖，干净环境中必须先把它们 install 到本地
      # 仓库（本地因已有 ~/.m2 snapshot 缓存而未暴露此问题）。
      - name: Maven 打包（install，含 JavaDoc）
        run: mvn -B -ntp install -DskipTests

      # ===== 阶段 4.5：如实反映测试结果（测试失败则 job 标红）=====
      - name: 检查测试结果
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "failure" ]; then
            echo "::error::自动化测试存在失败（上游 3 个基线失败：TestMimeTypeUtil / TestPdfFormatHandler#testIssue373 / TestFileUtil），流水线如实标红。"
            exit 1
          fi
          echo "自动化测试全部通过。"

      # ===== 阶段 6：归档构建制品与报告 =====
      - name: 归档构建制品（WAR / JAR）
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            docs-web/target/*.war
            docs-web/target/*.jar
            docs-core/target/*.jar
            docs-web-common/target/*.jar
          if-no-files-found: warn

      - name: 归档 Surefire 测试报告
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          if-no-files-found: warn

      - name: 归档 JaCoCo 覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/**
          if-no-files-found: warn

      - name: 归档 PMD 报告
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: |
            **/target/site/pmd.html
            **/target/pmd.xml
            **/target/cpd.xml
          if-no-files-found: warn

      - name: 归档 JavaDoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: |
            **/target/apidocs/**
            **/target/*-javadoc.jar
          if-no-files-found: warn
